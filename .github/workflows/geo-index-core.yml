# geo_index_core standalone tests (plan 02 B.1/B.2): Linux in the checked-in Docker
# image (ASan+UBSan, valgrind), macOS with Homebrew S2 (UBSan).
name: geo-index-core

on:
  push:
    paths:
      - 'contrib/geo_index_core/**'
      - '.github/workflows/geo-index-core.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: contrib/geo_index_core
      - run: docker build -t geo-index-core contrib/geo_index_core
      - run: docker run --rm -v "$PWD/contrib/geo_index_core":/src geo-index-core

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: contrib/geo_index_core
      - run: brew install cmake s2geometry googletest
      - run: contrib/geo_index_core/run_tests.sh
